name: Deploy Frontend to Qiniu

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v3

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3. 安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 4. 安装依赖（pnpm install）
      - name: Install dependencies
        working-directory: ./web
        run: pnpm install

      # 5. 构建前端（pnpm build）
      - name: Build web
        working-directory: ./web
        run: pnpm build

      # 6. 复制 404 页面为 index.html
      - name: Copy 404
        working-directory: ./web
        run: cp dist/index.html dist/errno-404

      # 7. 上传 dist 到七牛云
      - name: Upload to Qiniu
        working-directory: ./web
        run: node upload.cjs
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_ZONE: ${{ secrets.QINIU_ZONE }}
